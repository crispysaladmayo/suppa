name: Deploy app to GitHub Pages

# Two publish paths — use whichever matches repo Settings → Pages → Source:
# - "Deploy from a branch" → gh-pages / (root): job `publish_gh_pages_branch`
# - "GitHub Actions": job `publish_github_actions`
#
# If the live site looks stale, confirm the source matches one of the above.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish_gh_pages_branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp deploy (verify live site)
        run: |
          echo "sha=${{ github.sha }}" > app/.deploy-info.txt
          echo "run=${{ github.run_number }}" >> app/.deploy-info.txt
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> app/.deploy-info.txt

      - name: Push app/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          force_orphan: true

  publish_github_actions:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp deploy (verify live site)
        run: |
          echo "sha=${{ github.sha }}" > app/.deploy-info.txt
          echo "run=${{ github.run_number }}" >> app/.deploy-info.txt
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> app/.deploy-info.txt

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/

      - uses: actions/deploy-pages@v4
        id: deployment
