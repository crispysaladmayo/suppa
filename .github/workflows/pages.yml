name: Deploy app to GitHub Pages

# Publishes ./app to branch `gh-pages`. In the repo, set:
# Settings → Pages → Build and deployment → Source → Deploy from a branch
# → Branch: gh-pages, folder: / (root)
#
# If Source is left on "GitHub Actions" while the site never updates, switch
# to the branch source above so these files are what users see.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp deploy (verify live site)
        run: |
          echo "sha=${{ github.sha }}" > app/.deploy-info.txt
          echo "run=${{ github.run_number }}" >> app/.deploy-info.txt
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> app/.deploy-info.txt

      - name: Push app/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          force_orphan: true
