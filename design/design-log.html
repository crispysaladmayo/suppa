<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Makan — Suppa Design Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-tokens.css" />
  <style>
    .review-label { background:#1c1917;color:#fff;font-size:0.75rem;font-weight:500;padding:0.375rem 1rem;text-align:center;letter-spacing:0.04em; }
    .review-nav { background:var(--surface);border-bottom:1px solid var(--border-subtle);padding:0.5rem 1rem;display:flex;gap:0.75rem;overflow-x:auto;scrollbar-width:none;font-size:0.8125rem; }
    .review-nav a { color:var(--accent);white-space:nowrap; }
    .section-label { font-size:0.875rem;font-weight:600;margin:0 0 0.625rem;color:var(--text-primary); }
    .selected-groups { display:flex;flex-wrap:wrap;gap:0.375rem;min-height:32px;margin-bottom:0.625rem;padding:0.5rem;background:var(--accent-tint);border-radius:10px; }
    .selected-groups:empty::after { content:"Belum ada kelompok dipilih";color:var(--text-muted);font-size:0.8125rem; }
    .selected-group-tag {
      display:inline-flex;align-items:center;gap:0.375rem;
      background:var(--accent);color:#fff;
      padding:0.25rem 0.625rem;border-radius:var(--radius-pill);
      font-size:0.8125rem;font-weight:500;
    }
    .selected-group-tag button { background:none;border:none;color:#fff;cursor:pointer;padding:0;width:16px;height:16px;display:flex;align-items:center;justify-content:center;opacity:0.8; }
    .selected-group-tag button:hover { opacity:1; }
  </style>
</head>
<body>
<div class="review-label">Design Review — Log Makan (M2)</div>
<div class="review-nav">
  <a href="design-today.html">← Today</a>
  <a href="design-recipes.html">Recipes →</a>
  <a href="design-settings.html">Settings →</a>
</div>

<div class="app-frame">
  <!-- Top Bar -->
  <header class="top-bar">
    <button class="top-bar__icon-btn" aria-label="Kembali" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <p class="top-bar__title">Catat makan</p>
    <div style="width:44px"></div>
  </header>

  <main>
    <!-- Hint about food groups -->
    <div class="card" style="background:var(--info-soft-bg);box-shadow:none;border:1px solid #fde68a;margin-bottom:var(--space-4);">
      <p style="font-size:0.8125rem;color:var(--info-soft-text);margin:0;line-height:1.5;">
        <strong>Pilih kelompok makanan</strong> yang dimakan si kecil. Suppa akan menghitung perkiraan makro dari kelompok + porsi yang kamu pilih.
      </p>
    </div>

    <!-- Selected groups display -->
    <p class="section-label">Kelompok dipilih:</p>
    <div class="selected-groups" id="selected-groups" role="list" aria-label="Kelompok makanan dipilih" aria-live="polite"></div>

    <!-- Food group grid -->
    <p class="section-label" style="margin-top:0.875rem;">Pilih kelompok makanan:</p>
    <div class="food-group-grid" role="group" aria-label="Kelompok makanan">

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Serealia & umbi">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a5 5 0 015 5c0 4-5 12-5 12S7 11 7 7a5 5 0 015-5z"/></svg>
        Serealia & Umbi
      </button>

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Kacang-kacangan">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="5"/><path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Kacang-kacangan
      </button>

      <button type="button" class="food-group-btn" aria-pressed="true" data-group="Susu & produk susu">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l2 4H6L8 2z"/><path d="M6 6v12a2 2 0 002 2h8a2 2 0 002-2V6"/><path d="M10 11h4"/></svg>
        Susu & Produk Susu
      </button>

      <button type="button" class="food-group-btn" aria-pressed="true" data-group="Daging & ikan">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 00-12 0c0 7 6 13 6 13s6-6 6-13z"/></svg>
        Daging & Ikan
      </button>

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Telur">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="13" rx="7" ry="9"/></svg>
        Telur
      </button>

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Sayur kaya vit A">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C6 2 2 8 2 12s10 10 10 10 10-6 10-10S18 2 12 2z"/></svg>
        Sayur Vit A
      </button>

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Sayur & buah lainnya">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4"/></svg>
        Sayur & Buah
      </button>

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Minyak & lemak">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M6 6l6 4 6-4M6 18l6-4 6 4"/></svg>
        Minyak & Lemak
      </button>

      <button type="button" class="food-group-btn" aria-pressed="false" data-group="Minuman">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14l-3 8H8L5 3z"/><path d="M8 11l1 8a1 1 0 001 1h4a1 1 0 001-1l1-8"/></svg>
        Minuman
      </button>

    </div>

    <!-- Portion selector -->
    <p class="section-label">Porsi:</p>
    <div class="portion-selector" role="group" aria-label="Pilih porsi">
      <button type="button" class="portion-btn" aria-pressed="false" data-portion="sedikit">
        Sedikit<br><span style="font-size:0.75rem;font-weight:400;color:var(--text-muted);">¼ – ½ mangkuk</span>
      </button>
      <button type="button" class="portion-btn" aria-pressed="true" data-portion="sedang">
        Sedang<br><span style="font-size:0.75rem;font-weight:400;color:var(--text-muted);">½ – 1 mangkuk</span>
      </button>
      <button type="button" class="portion-btn" aria-pressed="false" data-portion="banyak">
        Banyak<br><span style="font-size:0.75rem;font-weight:400;color:var(--text-muted);">&gt;1 mangkuk</span>
      </button>
    </div>

    <!-- Optional meal name -->
    <div class="field">
      <label for="meal-name">Nama makan (opsional)</label>
      <input type="text" id="meal-name" placeholder="cth. Sarapan bubur nasi" autocomplete="off" />
      <p class="caption" style="margin-top:0.35rem;">Biarkan kosong jika tidak perlu</p>
    </div>

    <!-- Validation error (aria-live demo) -->
    <div id="form-error" class="field__error" aria-live="polite" role="alert" style="font-size:0.875rem;color:var(--error-text);margin-bottom:0.75rem;"></div>

    <!-- Save -->
    <button type="button" class="btn btn--primary" id="save-btn" style="margin-bottom:var(--space-6);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      Simpan catatan
    </button>
  </main>
</div>

<div id="toast" class="toast" aria-live="polite"></div>

<script>
  const selectedGroups = new Set(['Susu & produk susu', 'Daging & ikan']);
  const selectedGroupsEl = document.getElementById('selected-groups');
  const formError = document.getElementById('form-error');

  function renderSelectedGroups() {
    selectedGroupsEl.innerHTML = '';
    selectedGroups.forEach(g => {
      const tag = document.createElement('div');
      tag.className = 'selected-group-tag';
      tag.setAttribute('role', 'listitem');
      tag.innerHTML = `${g}<button type="button" aria-label="Hapus ${g}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
      tag.querySelector('button').addEventListener('click', () => {
        selectedGroups.delete(g);
        const foodBtn = document.querySelector(`[data-group="${g}"]`);
        if (foodBtn) foodBtn.setAttribute('aria-pressed', 'false');
        renderSelectedGroups();
      });
      selectedGroupsEl.appendChild(tag);
    });
  }

  // Food group buttons
  document.querySelectorAll('.food-group-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      const pressed = btn.getAttribute('aria-pressed') === 'true';
      if (pressed) {
        btn.setAttribute('aria-pressed', 'false');
        selectedGroups.delete(group);
      } else {
        btn.setAttribute('aria-pressed', 'true');
        selectedGroups.add(group);
      }
      renderSelectedGroups();
      formError.textContent = '';
    });
  });

  // Portion buttons
  document.querySelectorAll('.portion-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.portion-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  // Save
  document.getElementById('save-btn').addEventListener('click', () => {
    if (selectedGroups.size === 0) {
      formError.textContent = 'Pilih minimal satu kelompok makanan.';
      formError.classList.add('is-visible');
      return;
    }
    formError.textContent = '';
    const t = document.getElementById('toast');
    t.textContent = 'Makan tercatat ✓';
    t.classList.add('toast--show');
    setTimeout(() => {
      t.classList.remove('toast--show');
      location.href = 'design-today.html';
    }, 2800);
  });

  renderSelectedGroups();
</script>
</body>
</html>
