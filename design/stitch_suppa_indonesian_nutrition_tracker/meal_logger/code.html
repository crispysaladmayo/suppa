</div>
<div class="text-center">
<span class="font-headline font-bold text-lg block">Take a Photo</span>
<span class="text-on-surface-variant text-sm">Let AI detect your nutrients</span>
</div>
</button>
</div>

<div class="relative flex-grow">
<input class="w-full bg-surface-container-lowest border-none rounded-full px-6 py-4 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary-fixed-dim outline-none transition-all" placeholder="e.g. Nasi Tim Ayam" type="text"/>
</div>
<button class="bg-primary text-on-primary w-14 h-14 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</section>

<h3 class="font-headline font-bold text-[#7b5400] px-1">Cepat Pilih</h3>

<button class="px-5 py-2.5 bg-surface-container-lowest text-on-surface-variant font-medium rounded-full text-sm hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all shadow-sm">Nasi Tim</button>
<button class="px-5 py-2.5 bg-surface-container-lowest text-on-surface-variant font-medium rounded-full text-sm hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all shadow-sm">Sop Sayur</button>

<button class="px-5 py-2.5 bg-surface-container-lowest text-on-surface-variant font-medium rounded-full text-sm hover:bg-primary-container hover:text-on-primary-container active:scale-95 transition-all shadow-sm">Pepes Ikan</button>
</div>
