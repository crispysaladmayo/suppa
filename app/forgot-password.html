<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lupa kata sandi — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{background:"#fff6e2",surface:"#ffffff","surface-bright":"#fff6e2","surface-container-low":"#f9f0db","surface-container":"#f1e7d1","surface-container-high":"#ebe2ca","surface-container-highest":"#e6dcc3","surface-dim":"#ded4ba",primary:"#FFB300","primary-container":"#7b5400","on-primary":"#523700","on-primary-container":"#fff1df",secondary:"#b7004d","secondary-container":"#ffc2cc","on-secondary":"#ffeff0",tertiary:"#176a21","tertiary-container":"#9df197","on-tertiary":"#d1ffc8",error:"#b02500","error-container":"#f95630","on-surface":"#332e22","on-surface-variant":"#605b4c",outline:"#7c7666","outline-variant":"#b4ad9b"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},fontFamily:{headline:["Plus Jakarta Sans","sans-serif"],body:["Be Vietnam Pro","sans-serif"]}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body class="bg-background font-body text-on-surface min-h-dvh flex flex-col">

<div class="app-frame flex-1 flex flex-col max-w-[480px] mx-auto w-full px-6 pb-8" style="padding-top:calc(env(safe-area-inset-top,0) + 1rem)">
  <!-- Top bar -->
  <div class="flex items-center justify-between mb-8">
    <a href="login.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container-low" aria-label="Kembali">
      <span class="material-symbols-outlined text-[20px] text-on-surface">arrow_back</span>
    </a>
    <span class="font-headline font-black text-xl text-primary tracking-tight">Suppa</span>
    <div class="w-9"></div>
  </div>

  <!-- Form state -->
  <main class="flex-1" id="main-forgot">
    <h1 class="font-headline font-bold text-2xl text-on-surface mb-1">Lupa kata sandi?</h1>
    <p class="text-sm text-on-surface-variant mb-6">Masukkan email yang kamu gunakan untuk mendaftar. Kami akan kirim tautan untuk membuat kata sandi baru.</p>

    <form id="forgot-form" novalidate class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-semibold text-on-surface mb-1.5">Alamat email</label>
        <input type="email" id="email" inputmode="email" autocomplete="email" aria-required="true" aria-describedby="email-error"
          class="w-full min-h-[48px] px-4 py-3 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
        <p class="field__error text-xs" id="email-error" role="alert" aria-live="polite"></p>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-full bg-primary text-on-primary font-headline font-bold text-base shadow-[0_4px_16px_rgba(255,179,0,0.4)] active:scale-[0.98] transition-transform">
        Kirim tautan
      </button>
    </form>
  </main>

  <!-- Success state -->
  <div id="success-state" hidden class="flex-1 flex flex-col items-center text-center pt-12">
    <div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mb-5">
      <span class="text-4xl">✉️</span>
    </div>
    <h2 class="font-headline font-bold text-2xl text-on-surface mb-2">Cek emailmu</h2>
    <p class="text-sm text-on-surface-variant mb-6">Kami telah mengirim tautan reset kata sandi ke emailmu. Tautan berlaku 30 menit.</p>
    <a href="login.html" class="px-8 py-3 rounded-full bg-surface-container-highest text-on-surface font-semibold text-sm">Kembali ke halaman masuk</a>
  </div>
</div>

<script src="js/tokens.js"></script><script src="js/profile.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var errEl = document.getElementById('email-error');
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Masukkan alamat email yang valid.'; errEl.style.display = 'block'; return; }
  document.getElementById('main-forgot').hidden = true;
  var suc = document.getElementById('success-state');
  suc.hidden = false;
  suc.style.display = 'flex';
});
</script>
</body>
</html>
