<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lupa kata sandi — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-frame app-frame--auth">
  <header class="top-bar"><a class="top-bar__icon-btn" href="login.html" aria-label="Kembali"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a><div style="width:44px"></div></header>
  <main style="flex:1;" id="main-forgot">
    <h1 class="title">Lupa kata sandi?</h1>
    <p class="body-muted" style="margin-bottom:1.5rem;">Masukkan email yang kamu gunakan untuk mendaftar. Kami akan kirim tautan untuk membuat kata sandi baru.</p>
    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Alamat email</label>
        <input type="email" id="email" inputmode="email" autocomplete="email" aria-required="true" aria-describedby="email-error" />
        <p class="field__error" id="email-error" role="alert" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn btn--primary">Kirim tautan</button>
    </form>
  </main>
  <div id="success-state" hidden style="flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:var(--space-8);">
    <p style="font-size:3rem;margin:0 0 1rem;">✉️</p>
    <h2 class="title">Cek emailmu</h2>
    <p class="body-muted" style="margin-bottom:1.5rem;">Kami telah mengirim tautan reset kata sandi ke emailmu. Tautan berlaku 30 menit.</p>
    <a href="login.html" class="btn btn--secondary" style="width:auto;padding:0.75rem 1.5rem;">Kembali ke halaman masuk</a>
  </div>
</div>
<script src="js/tokens.js"></script><script src="js/profile.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var errEl = document.getElementById('email-error');
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Masukkan alamat email yang valid.'; errEl.style.display = 'block'; return; }
  document.getElementById('main-forgot').hidden = true;
  var suc = document.getElementById('success-state');
  suc.hidden = false;
  suc.style.display = 'flex';
});
</script>
</body>
</html>
