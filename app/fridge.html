<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masak dari kulkas — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{background:"#fff6e2",surface:"#ffffff","surface-bright":"#fff6e2","surface-container-low":"#f9f0db","surface-container":"#f1e7d1","surface-container-high":"#ebe2ca","surface-container-highest":"#e6dcc3","surface-dim":"#ded4ba",primary:"#7b5400","primary-container":"#feb300","on-primary":"#fff1df","on-primary-container":"#523700",secondary:"#b7004d","secondary-container":"#ffc2cc","on-secondary":"#ffeff0",tertiary:"#176a21","tertiary-container":"#9df197","on-tertiary":"#d1ffc8",error:"#b02500","error-container":"#f95630","on-surface":"#332e22","on-surface-variant":"#605b4c",outline:"#7c7666","outline-variant":"#b4ad9b"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},fontFamily:{headline:["Plus Jakarta Sans","sans-serif"],body:["Be Vietnam Pro","sans-serif"]}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body class="bg-background font-body text-on-surface">

<header class="fixed top-0 inset-x-0 z-40 bg-surface-bright/80 backdrop-blur-md shadow-[0_1px_0_rgba(51,46,34,0.06)]">
  <div class="max-w-[480px] mx-auto flex items-center gap-3 px-4 h-16" style="padding-top:env(safe-area-inset-top,0)">
    <a href="today.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container-low flex-shrink-0" aria-label="Kembali">
      <span class="material-symbols-outlined text-[20px] text-on-surface">arrow_back</span>
    </a>
    <h1 class="flex-1 font-headline font-bold text-lg text-on-surface">Masak dari Kulkas</h1>
  </div>
</header>

<div class="app-frame min-h-dvh max-w-[480px] mx-auto">
  <main class="pt-20 pb-28 px-4 space-y-5">

    <p class="text-sm text-on-surface-variant leading-relaxed">Masukkan bahan yang ada di kulkasmu. Suppa akan carikan resep yang bisa dibuat dan aman untuk si kecil.</p>

    <form id="fridge-form" novalidate>
      <!-- Input row -->
      <div class="flex gap-2 mb-3">
        <input type="text" id="fridge-input" placeholder="Ketik bahan, tekan Enter…" autocomplete="off" aria-label="Tambah bahan" aria-describedby="fridge-error"
          class="flex-1 min-h-[48px] px-4 py-3 rounded-full bg-surface-container border border-outline-variant/50 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
        <button type="button" id="add-ingredient-btn" class="px-5 py-2 rounded-full bg-surface-container-high text-on-surface font-semibold text-sm">Tambah</button>
      </div>

      <!-- Tags -->
      <div id="fridge-tags" role="list" aria-label="Bahan yang dipilih" aria-live="polite" class="flex flex-wrap gap-2 min-h-6 mb-3"></div>

      <p class="field__error text-xs" id="fridge-error" role="alert" aria-live="polite"></p>

      <button type="submit" class="w-full py-3.5 rounded-full bg-secondary text-on-secondary font-headline font-bold text-base shadow-[0_4px_16px_rgba(183,0,77,0.3)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[20px]">search</span>
        Cari resep
      </button>
    </form>

    <!-- Popular suggestions -->
    <div>
      <p class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-3">Bahan populer</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="chip" data-suggest="Ayam">🍗 Ayam</button>
        <button type="button" class="chip" data-suggest="Wortel">🥕 Wortel</button>
        <button type="button" class="chip" data-suggest="Bayam">🥬 Bayam</button>
        <button type="button" class="chip" data-suggest="Tempe">🫘 Tempe</button>
        <button type="button" class="chip" data-suggest="Telur">🥚 Telur</button>
        <button type="button" class="chip" data-suggest="Tahu">🍚 Tahu</button>
        <button type="button" class="chip" data-suggest="Brokoli">🥦 Brokoli</button>
        <button type="button" class="chip" data-suggest="Hati ayam">🍗 Hati ayam</button>
      </div>
    </div>

  </main>
</div>

<!-- Bottom nav -->
<nav class="fixed bottom-0 inset-x-0 z-50 bg-white/95 backdrop-blur-md rounded-t-[2rem] shadow-[0_-2px_20px_rgba(51,46,34,0.08)]" aria-label="Navigasi utama">
  <div class="max-w-[480px] mx-auto flex items-start pt-3" style="padding-bottom:calc(0.75rem + env(safe-area-inset-bottom,0))">
    <a href="today.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">home</span></span><span class="text-[11px] font-medium text-on-surface-variant">Beranda</span></a>
    <a href="log-add.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">edit_note</span></span><span class="text-[11px] font-medium text-on-surface-variant">Catat</span></a>
    <a href="edukasi.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">menu_book</span></span><span class="text-[11px] font-medium text-on-surface-variant">Panduan</span></a>
    <a href="settings.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">person</span></span><span class="text-[11px] font-medium text-on-surface-variant">Profil</span></a>
  </div>
</nav>

<div id="toast" class="toast" aria-live="polite"></div>
<script src="js/tokens.js"></script><script src="js/profile.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
(function() {
  var tagsEl = document.getElementById('fridge-tags');
  var input = document.getElementById('fridge-input');
  var errEl = document.getElementById('fridge-error');

  function addTag(val) {
    val = val.trim();
    if (!val) return;
    var existing = Array.from(tagsEl.querySelectorAll('[data-ingredient]')).map(function(t) { return t.dataset.ingredient.toLowerCase(); });
    if (existing.includes(val.toLowerCase())) return;
    var tag = document.createElement('span');
    tag.className = 'chip is-active fridge-tag';
    tag.dataset.ingredient = val;
    tag.setAttribute('role', 'listitem');
    tag.innerHTML = val + '<button type="button" aria-label="Hapus ' + val + '" style="background:none;border:none;cursor:pointer;padding:0 0 0 6px;color:var(--accent);font-size:1rem;line-height:1;min-height:0;">&times;</button>';
    tag.querySelector('button').addEventListener('click', function() { tag.remove(); });
    tagsEl.appendChild(tag);
    errEl.style.display = 'none';
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addTag(input.value); input.value = ''; }
  });
  document.getElementById('add-ingredient-btn').addEventListener('click', function() { addTag(input.value); input.value = ''; });

  document.querySelectorAll('[data-suggest]').forEach(function(chip) {
    chip.addEventListener('click', function() { addTag(chip.dataset.suggest); chip.classList.add('is-active'); });
  });

  document.getElementById('fridge-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var tags = Array.from(tagsEl.querySelectorAll('[data-ingredient]')).map(function(t) { return t.dataset.ingredient; });
    if (input.value.trim()) tags.push(input.value.trim());
    if (!tags.length) { errEl.textContent = 'Masukkan setidaknya satu bahan.'; errEl.style.display = 'block'; return; }
    sessionStorage.setItem('suppa_fridge_ingredients', tags.join(','));
    window.location.href = 'fridge-results.html';
  });
})();
</script>
</body>
</html>
