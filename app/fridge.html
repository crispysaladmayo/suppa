<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masak dari kulkas — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-frame">
  <header class="top-bar">
    <a class="top-bar__icon-btn" href="today.html" aria-label="Kembali">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <h1 class="top-bar__title">Masak dari kulkas</h1>
    <div style="width:44px"></div>
  </header>

  <main>
    <p class="body-muted" style="margin-bottom:1.25rem;">Masukkan bahan yang ada di kulkasmu. Suppa akan carikan resep yang bisa dibuat dan aman untuk si kecil.</p>

    <form id="fridge-form" novalidate>
      <div class="fridge-input-row">
        <input type="text" id="fridge-input" placeholder="Ketik bahan, tekan Enter…" autocomplete="off" aria-label="Tambah bahan" aria-describedby="fridge-error" />
        <button type="button" class="btn btn--secondary" id="add-ingredient-btn" style="width:auto;padding:0.625rem 1rem;">Tambah</button>
      </div>

      <div id="fridge-tags" role="list" aria-label="Bahan yang dipilih" aria-live="polite">
        <!-- Prefilled demo -->
      </div>

      <p class="field__error" id="fridge-error" role="alert" aria-live="polite" style="display:none;margin-bottom:0.75rem;"></p>

      <button type="submit" class="btn btn--primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Cari resep
      </button>
    </form>

    <div style="margin-top:var(--space-6);">
      <p class="overline" style="margin-bottom:0.75rem;">Bahan populer</p>
      <div class="chip-group">
        <button type="button" class="chip" data-suggest="Ayam">Ayam</button>
        <button type="button" class="chip" data-suggest="Wortel">Wortel</button>
        <button type="button" class="chip" data-suggest="Bayam">Bayam</button>
        <button type="button" class="chip" data-suggest="Tempe">Tempe</button>
        <button type="button" class="chip" data-suggest="Telur">Telur</button>
        <button type="button" class="chip" data-suggest="Tahu">Tahu</button>
        <button type="button" class="chip" data-suggest="Brokoli">Brokoli</button>
        <button type="button" class="chip" data-suggest="Hati ayam">Hati ayam</button>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav" aria-label="Navigasi utama">
  <a href="today.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Log Harian</a>
  <a href="fridge.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Masak</a>
  <a href="edukasi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Edukasi</a>
</nav>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="js/tokens.js"></script><script src="js/profile.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
(function() {
  var tagsEl = document.getElementById('fridge-tags');
  var input = document.getElementById('fridge-input');
  var errEl = document.getElementById('fridge-error');

  function addTag(val) {
    val = val.trim();
    if (!val) return;
    var existing = Array.from(tagsEl.querySelectorAll('[data-ingredient]')).map(function(t) { return t.dataset.ingredient.toLowerCase(); });
    if (existing.includes(val.toLowerCase())) return;
    var tag = document.createElement('span');
    tag.className = 'chip is-active fridge-tag'; tag.dataset.ingredient = val; tag.setAttribute('role', 'listitem');
    tag.innerHTML = val + '<button type="button" aria-label="Hapus ' + val + '" style="background:none;border:none;cursor:pointer;padding:0 0 0 6px;color:var(--accent);font-size:1rem;line-height:1;min-height:0;">&times;</button>';
    tag.querySelector('button').addEventListener('click', function() { tag.remove(); });
    tagsEl.appendChild(tag);
    errEl.style.display = 'none';
  }

  // Enter key
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addTag(input.value); input.value = ''; }
  });
  document.getElementById('add-ingredient-btn').addEventListener('click', function() { addTag(input.value); input.value = ''; });

  // Suggestion chips
  document.querySelectorAll('[data-suggest]').forEach(function(chip) {
    chip.addEventListener('click', function() { addTag(chip.dataset.suggest); chip.classList.add('is-active'); });
  });

  // Form submit (override app.js basic handler for the display part)
  document.getElementById('fridge-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var tags = Array.from(tagsEl.querySelectorAll('[data-ingredient]')).map(function(t) { return t.dataset.ingredient; });
    if (input.value.trim()) tags.push(input.value.trim());
    if (!tags.length) { errEl.textContent = 'Masukkan setidaknya satu bahan.'; errEl.style.display = 'block'; return; }
    sessionStorage.setItem('suppa_fridge_ingredients', tags.join(','));
    window.location.href = 'fridge-results.html';
  });
})();
</script>
</body>
</html>
