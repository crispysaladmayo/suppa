<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buat akun — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-frame app-frame--auth">
  <header class="top-bar">
    <a class="top-bar__icon-btn" href="index.html" aria-label="Kembali">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <a class="brand-lockup brand-lockup--auth" href="index.html" style="margin:0;">
      <img class="brand-lockup__mark" src="assets/suppa-logo.svg" alt="" aria-hidden="true" />
      <span class="brand-lockup__name">Suppa</span>
    </a>
    <div style="width:44px"></div>
  </header>
  <main style="flex:1;">
    <h1 class="title">Buat akun</h1>
    <p class="body-muted" style="margin-bottom:1.5rem;">Mulai perjalanan gizi si kecil bersama Suppa.</p>
    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">Alamat email</label>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email" aria-required="true" aria-describedby="email-error" placeholder="mama@email.com" />
        <p class="field__error" id="email-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" name="password" autocomplete="new-password" aria-required="true" aria-describedby="password-error password-hint" placeholder="Minimal 8 karakter" />
        <p class="field__hint" id="password-hint">Minimal 8 karakter</p>
        <p class="field__error" id="password-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password-confirm">Konfirmasi kata sandi</label>
        <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password" aria-required="true" aria-describedby="confirm-error" />
        <p class="field__error" id="confirm-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="btn-row" style="margin-top:1rem;">
        <button type="submit" class="btn btn--primary">Buat akun</button>
      </div>
    </form>
    <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </main>
  <footer class="footer-links" style="justify-content:center;">
    <a href="privacy.html">Privasi</a> <span style="color:var(--text-muted);">·</span> <a href="terms.html">Syarat</a>
  </footer>
</div>
<script src="js/tokens.js"></script>
<script src="js/profile.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('signup-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var pw = document.getElementById('password').value;
  var pwc = document.getElementById('password-confirm').value;
  var ok = true;
  function err(id, msg) { var el = document.getElementById(id); el.textContent = msg; el.classList.add('is-visible'); el.style.display = 'block'; ok = false; }
  function clr(id) { var el = document.getElementById(id); el.textContent = ''; el.classList.remove('is-visible'); el.style.display = ''; }
  clr('email-error'); clr('password-error'); clr('confirm-error');
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) err('email-error', 'Masukkan alamat email yang valid.');
  if (!pw || pw.length < 8) err('password-error', 'Kata sandi minimal 8 karakter.');
  if (pw !== pwc) err('confirm-error', 'Kata sandi tidak cocok.');
  if (!ok) return;
  window.location.href = 'onboarding.html';
});
</script>
</body>
</html>
