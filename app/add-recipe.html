<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tambah resep — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{background:"#fff6e2",surface:"#fff6e2","surface-bright":"#fff6e2","surface-container-low":"#f9f0db","surface-container":"#f1e7d1","surface-container-high":"#ebe2ca","surface-container-highest":"#e6dcc3","surface-dim":"#ded4ba","surface-container-lowest":"#ffffff",primary:"#7b5400","primary-container":"#feb300","on-primary":"#fff1df","on-primary-container":"#523700",secondary:"#b7004d","secondary-container":"#ffc2cc","on-secondary":"#ffeff0","on-secondary-container":"#91003c",tertiary:"#176a21","tertiary-container":"#9df197","on-tertiary":"#d1ffc8","on-tertiary-container":"#005c15",error:"#b02500","error-container":"#f95630","on-surface":"#332e22","on-surface-variant":"#605b4c",outline:"#7c7666","outline-variant":"#b4ad9b","on-background":"#332e22","on-background-variant":"#605b4c"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},fontFamily:{headline:["Plus Jakarta Sans","sans-serif"],body:["Be Vietnam Pro","sans-serif"]}}}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body class="bg-background font-body text-on-background">

<!-- Fixed header -->
<header class="fixed top-0 inset-x-0 z-40 bg-surface-bright/80 backdrop-blur-md shadow-[0_0_24px_rgba(51,46,34,0.06)]">
  <div class="max-w-[480px] mx-auto flex items-center gap-3 px-4 h-16" style="padding-top:env(safe-area-inset-top,0)">
    <a href="recipes.html" class="w-9 h-9 flex items-center justify-center rounded-full bg-surface-container-low flex-shrink-0" aria-label="Kembali">
      <span class="material-symbols-outlined text-[20px] text-on-surface">arrow_back</span>
    </a>
    <h1 class="flex-1 font-headline font-bold text-lg text-on-surface">Tambah resep</h1>
  </div>
</header>

<div class="app-frame min-h-dvh max-w-[480px] mx-auto">
  <main class="pt-20 pb-28 px-4">
    <form id="add-recipe-form" novalidate class="space-y-4">

      <div>
        <label for="recipe-title" class="block text-sm font-semibold text-on-surface mb-1.5">Nama resep <span class="text-error">*</span></label>
        <input type="text" id="recipe-title" placeholder="cth. Nasi Tim Ayam Wortel" autocomplete="off" aria-required="true" aria-describedby="recipe-title-error"
          class="w-full min-h-[48px] px-4 py-3 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
        <p class="field__error text-xs" id="recipe-title-error" role="alert" aria-live="polite"></p>
      </div>

      <div>
        <label for="recipe-minutes" class="block text-sm font-semibold text-on-surface mb-1.5">Waktu memasak (menit)</label>
        <input type="number" id="recipe-minutes" value="25" min="1" max="300"
          class="w-full min-h-[48px] px-4 py-3 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
      </div>

      <div>
        <label for="recipe-ingredients" class="block text-sm font-semibold text-on-surface mb-1.5">Bahan-bahan <span class="text-error">*</span></label>
        <textarea id="recipe-ingredients" placeholder="Satu bahan per baris&#10;cth. 100g daging ayam&#10;1 buah wortel" aria-required="true" aria-describedby="recipe-ingredients-error"
          class="w-full min-h-[120px] px-4 py-3 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 resize-none"></textarea>
        <p class="field__error text-xs" id="recipe-ingredients-error" role="alert" aria-live="polite"></p>
      </div>

      <div>
        <label for="recipe-instructions" class="block text-sm font-semibold text-on-surface mb-1.5">Cara membuat (opsional)</label>
        <textarea id="recipe-instructions" placeholder="Langkah-langkah memasak…"
          class="w-full min-h-[140px] px-4 py-3 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 resize-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-on-surface mb-2">Penekanan makro</label>
        <div class="grid grid-cols-3 gap-2" role="radiogroup" aria-label="Pilih penekanan makro">
          <label class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-2xl bg-surface-container border border-outline-variant/40 cursor-pointer text-center has-[:checked]:border-error has-[:checked]:bg-error-container/20">
            <input type="radio" name="emphasis" value="iron" class="sr-only" /><span class="text-xl">🔴</span><span class="text-xs font-medium text-on-surface">Iron</span>
          </label>
          <label class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-2xl bg-surface-container border border-outline-variant/40 cursor-pointer text-center has-[:checked]:border-primary has-[:checked]:bg-primary-container/20">
            <input type="radio" name="emphasis" value="zinc" class="sr-only" /><span class="text-xl">🟡</span><span class="text-xs font-medium text-on-surface">Zinc</span>
          </label>
          <label class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-2xl bg-surface-container border border-outline-variant/40 cursor-pointer text-center has-[:checked]:border-tertiary has-[:checked]:bg-tertiary-container/30">
            <input type="radio" name="emphasis" value="protein" checked class="sr-only" /><span class="text-xl">🟢</span><span class="text-xs font-medium text-on-surface">Protein</span>
          </label>
          <label class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-2xl bg-surface-container border border-outline-variant/40 cursor-pointer text-center has-[:checked]:border-secondary has-[:checked]:bg-secondary-container/30">
            <input type="radio" name="emphasis" value="carbs" class="sr-only" /><span class="text-xl">🟠</span><span class="text-xs font-medium text-on-surface">Karbo</span>
          </label>
          <label class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-2xl bg-surface-container border border-outline-variant/40 cursor-pointer text-center has-[:checked]:border-outline has-[:checked]:bg-surface-container-highest">
            <input type="radio" name="emphasis" value="fat" class="sr-only" /><span class="text-xl">🔵</span><span class="text-xs font-medium text-on-surface">Lemak</span>
          </label>
          <label class="flex flex-col items-center gap-1.5 px-3 py-3 rounded-2xl bg-surface-container border border-outline-variant/40 cursor-pointer text-center has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/20">
            <input type="radio" name="emphasis" value="energy" class="sr-only" /><span class="text-xl">⚡</span><span class="text-xs font-medium text-on-surface">Energi</span>
          </label>
        </div>
      </div>

      <!-- Optional macros -->
      <div>
        <button type="button" id="macros-toggle" aria-expanded="false" aria-controls="macros-section"
          class="w-full flex items-center justify-between px-4 py-3 rounded-2xl suppa-card-elevated text-sm font-semibold text-on-surface">
          <span>+ Tambah estimasi makro per sajian (opsional)</span>
          <span class="material-symbols-outlined text-[18px] text-on-surface-variant">expand_more</span>
        </button>
        <div id="macros-section" hidden class="mt-3 grid grid-cols-2 gap-3">
          <div>
            <label for="m-energy" class="block text-xs font-semibold text-on-surface mb-1">Energi (kkal)</label>
            <input type="number" id="m-energy" min="0" class="w-full min-h-[44px] px-4 py-2 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
          </div>
          <div>
            <label for="m-protein" class="block text-xs font-semibold text-on-surface mb-1">Protein (g)</label>
            <input type="number" id="m-protein" min="0" class="w-full min-h-[44px] px-4 py-2 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
          </div>
          <div>
            <label for="m-carbs" class="block text-xs font-semibold text-on-surface mb-1">Karbo (g)</label>
            <input type="number" id="m-carbs" min="0" class="w-full min-h-[44px] px-4 py-2 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
          </div>
          <div>
            <label for="m-fat" class="block text-xs font-semibold text-on-surface mb-1">Lemak (g)</label>
            <input type="number" id="m-fat" min="0" class="w-full min-h-[44px] px-4 py-2 rounded-2xl bg-surface-container border border-outline-variant/50 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" />
          </div>
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-full bg-primary text-on-primary font-headline font-bold text-base shadow-[0_4px_16px_rgba(255,179,0,0.4)] active:scale-[0.98] transition-transform">
        <span class="flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[20px]">check</span>Simpan resep
        </span>
      </button>

    </form>
  </main>
</div>

<!-- Bottom nav -->
<nav class="fixed bottom-0 inset-x-0 z-50 bg-surface-container-lowest/95 backdrop-blur-md rounded-t-[2rem] shadow-[0_-4px_24px_rgba(51,46,34,0.06)]" aria-label="Navigasi utama">
  <div class="max-w-[480px] mx-auto flex items-start pt-3" style="padding-bottom:calc(0.75rem + env(safe-area-inset-bottom,0))">
    <a href="today.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">home</span></span><span class="text-[11px] font-medium text-on-surface-variant">Beranda</span></a>
    <a href="log-add.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">edit_note</span></span><span class="text-[11px] font-medium text-on-surface-variant">Catat</span></a>
    <a href="edukasi.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">menu_book</span></span><span class="text-[11px] font-medium text-on-surface-variant">Panduan</span></a>
    <a href="settings.html" class="flex-1 flex flex-col items-center gap-0.5"><span class="flex items-center justify-center px-5 py-1"><span class="material-symbols-outlined text-[22px] text-on-surface-variant">person</span></span><span class="text-[11px] font-medium text-on-surface-variant">Profil</span></a>
  </div>
</nav>

<div id="toast" class="toast" aria-live="polite"></div>
<script src="js/tokens.js"></script><script src="js/profile.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
document.getElementById('macros-toggle').addEventListener('click', function() {
  var sec = document.getElementById('macros-section');
  var open = !sec.hidden;
  sec.hidden = open;
  this.setAttribute('aria-expanded', open ? 'false' : 'true');
  var span = this.querySelector('span:first-child');
  if (span) span.textContent = open ? '+ Tambah estimasi makro per sajian (opsional)' : '− Sembunyikan estimasi makro';
  var icon = this.querySelector('.material-symbols-outlined');
  if (icon) icon.textContent = open ? 'expand_more' : 'expand_less';
});
</script>
</body>
</html>
