<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tambah resep — Suppa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-frame">
  <header class="top-bar">
    <a class="top-bar__icon-btn" href="recipes.html" aria-label="Kembali"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
    <h1 class="top-bar__title">Tambah resep</h1>
    <div style="width:44px"></div>
  </header>
  <main>
    <form id="add-recipe-form" novalidate>
      <div class="field">
        <label for="recipe-title">Nama resep <span style="color:var(--error-text)">*</span></label>
        <input type="text" id="recipe-title" placeholder="cth. Nasi Tim Ayam Wortel" autocomplete="off" aria-required="true" aria-describedby="recipe-title-error" />
        <p class="field__error" id="recipe-title-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="recipe-minutes">Waktu memasak (menit)</label>
        <input type="number" id="recipe-minutes" value="25" min="1" max="300" />
      </div>
      <div class="field">
        <label for="recipe-ingredients">Bahan-bahan <span style="color:var(--error-text)">*</span></label>
        <textarea id="recipe-ingredients" placeholder="Satu bahan per baris&#10;cth. 100g daging ayam&#10;1 buah wortel&#10;2 sdm nasi" aria-required="true" aria-describedby="recipe-ingredients-error"></textarea>
        <p class="field__error" id="recipe-ingredients-error" role="alert" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="recipe-instructions">Cara membuat (opsional)</label>
        <textarea id="recipe-instructions" placeholder="Langkah-langkah memasak…" style="min-height:160px;"></textarea>
      </div>
      <div class="field">
        <label>Penekanan makro</label>
        <div class="emphasis-grid" role="radiogroup" aria-label="Pilih penekanan makro">
          <label class="emphasis-option"><input type="radio" name="emphasis" value="iron" /><span aria-hidden="true">🔴</span>Iron</label>
          <label class="emphasis-option"><input type="radio" name="emphasis" value="zinc" /><span aria-hidden="true">🟡</span>Zinc</label>
          <label class="emphasis-option"><input type="radio" name="emphasis" value="protein" checked /><span aria-hidden="true">🟢</span>Protein</label>
          <label class="emphasis-option"><input type="radio" name="emphasis" value="carbs" /><span aria-hidden="true">🟠</span>Karbo</label>
          <label class="emphasis-option"><input type="radio" name="emphasis" value="fat" /><span aria-hidden="true">🔵</span>Lemak</label>
          <label class="emphasis-option"><input type="radio" name="emphasis" value="energy" /><span aria-hidden="true">⚡</span>Energi</label>
        </div>
      </div>

      <!-- Optional macros collapsible -->
      <button type="button" class="collapsible-trigger" id="macros-toggle" aria-expanded="false" aria-controls="macros-section">+ Tambah estimasi makro per sajian (opsional)</button>
      <div id="macros-section" hidden style="margin-top:0.875rem;">
        <div class="grid-2">
          <div class="field" style="margin:0;"><label for="m-energy">Energi (kkal)</label><input type="number" id="m-energy" min="0" /></div>
          <div class="field" style="margin:0;"><label for="m-protein">Protein (g)</label><input type="number" id="m-protein" min="0" /></div>
          <div class="field" style="margin:0;"><label for="m-carbs">Karbo (g)</label><input type="number" id="m-carbs" min="0" /></div>
          <div class="field" style="margin:0;"><label for="m-fat">Lemak (g)</label><input type="number" id="m-fat" min="0" /></div>
        </div>
      </div>

      <div class="btn-row" style="margin-top:1.25rem;">
        <button type="submit" class="btn btn--primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Simpan resep</button>
      </div>
    </form>
  </main>
</div>
<nav class="bottom-nav" aria-label="Navigasi utama">
  <a href="today.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Log Harian</a>
  <a href="fridge.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Masak</a>
  <a href="edukasi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Edukasi</a>
</nav>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="js/tokens.js"></script><script src="js/profile.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/app.js"></script>
<script>
document.getElementById('macros-toggle').addEventListener('click', function() {
  var sec = document.getElementById('macros-section');
  var open = !sec.hidden;
  sec.hidden = open;
  this.setAttribute('aria-expanded', open ? 'false' : 'true');
  this.textContent = open ? '+ Tambah estimasi makro per sajian (opsional)' : '− Sembunyikan estimasi makro';
});
</script>
</body>
</html>
